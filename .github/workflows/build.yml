name: build-installer

# Push a version tag (e.g. git tag v0.1.0 && git push --tags) to build the
# installer and attach it to a GitHub Release. Or run it manually from the
# Actions tab (workflow_dispatch) to get the installer as a downloadable artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Generate icon
        run: python tools/make_icon.py

      - name: Build RootreX.exe (PyInstaller)
        run: pyinstaller --noconfirm rootrex.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\rootrex.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RootreX-Setup
          path: installer/Output/RootreX-Setup.exe

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/RootreX-Setup.exe
