<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="RootreX">
  <defs>
    <clipPath id="sq"><rect x="6" y="6" width="244" height="244" rx="52"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="48%" r="72%">
      <stop offset="0" stop-color="#1c0a16"/>
      <stop offset="1" stop-color="#070307"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff2a44" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#e01030" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e01030" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2a0208"/>
      <stop offset="0.30" stop-color="#8a0018"/>
      <stop offset="0.60" stop-color="#d2112f"/>
      <stop offset="0.85" stop-color="#ff2f4a"/>
      <stop offset="1" stop-color="#480413"/>
    </radialGradient>
    <radialGradient id="pupil" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#1a0206"/>
      <stop offset="1" stop-color="#050102"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#sq)">
    <rect width="256" height="256" fill="url(#bg)"/>
    <circle cx="128" cy="128" r="104" fill="url(#glow)"/>

    <!-- iris -->
    <circle cx="128" cy="128" r="74" fill="url(#iris)"/>

    <!-- flame streaks -->
    <g stroke="#ff5a70" stroke-width="1.6" stroke-opacity="0.35" stroke-linecap="round">
      <line x1="128" y1="60"  x2="128" y2="86"/>
      <line x1="170" y1="70"  x2="156" y2="92"/>
      <line x1="196" y1="128" x2="170" y2="128"/>
      <line x1="170" y1="186" x2="156" y2="164"/>
      <line x1="128" y1="196" x2="128" y2="170"/>
      <line x1="86"  y1="186" x2="100" y2="164"/>
      <line x1="60"  y1="128" x2="86"  y2="128"/>
      <line x1="86"  y1="70"  x2="100" y2="92"/>
      <line x1="150" y1="63"  x2="142" y2="88"/>
      <line x1="193" y1="99"  x2="168" y2="110"/>
      <line x1="193" y1="157" x2="168" y2="146"/>
      <line x1="150" y1="193" x2="142" y2="168"/>
      <line x1="106" y1="193" x2="114" y2="168"/>
      <line x1="63"  y1="157" x2="88"  y2="146"/>
      <line x1="63"  y1="99"  x2="88"  y2="110"/>
      <line x1="106" y1="63"  x2="114" y2="88"/>
    </g>

    <!-- bright limbal ring -->
    <circle cx="128" cy="128" r="71" fill="none" stroke="#ff3a54" stroke-width="3.2" stroke-opacity="0.8"/>

    <!-- evil slit pupil -->
    <ellipse cx="128" cy="128" rx="15" ry="48" fill="url(#pupil)"/>
    <ellipse cx="128" cy="128" rx="15" ry="48" fill="none" stroke="#ff2a46" stroke-width="2.6" stroke-opacity="0.85"/>
    <!-- catchlight -->
    <circle cx="121" cy="108" r="6.5" fill="#ffd3d9" fill-opacity="0.7"/>
  </g>

  <!-- rim -->
  <rect x="6" y="6" width="244" height="244" rx="52" fill="none" stroke="#ff3a54" stroke-opacity="0.22" stroke-width="2.5"/>
</svg>
